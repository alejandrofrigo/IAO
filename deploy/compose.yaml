services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      APP_ENV: production
      IAO_STATE_DIR: /var/lib/iao
      IAO_CORPUS_DIR: /app/knowledge
    ports:
      - "8080:8080"
    volumes:
      - iao_state:/var/lib/iao
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  iao_state: {}
