services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env.production
    environment:
      APP_ENV: production
      IAO_STATE_DIR: /var/lib/iao
      IAO_CORPUS_DIR: /app/knowledge
      IAO_SESSION_SIGNING_KEY: ${IAO_SESSION_SIGNING_KEY:?set IAO_SESSION_SIGNING_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY}
      IAO_TASK_WORKER_ENABLED: ${IAO_TASK_WORKER_ENABLED:-true}
      IAO_IDENTITY_ROLLBACK_DIR: /var/lib/iao/identity-trust
      IAO_CORS_ORIGINS: ${IAO_CORS_ORIGINS:?set exact IAO_CORS_ORIGINS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set HTTPS PUBLIC_BASE_URL}
    ports:
      - "8080:8080"
    volumes:
      - iao_state:/var/lib/iao
      - iao_identity_trust:/var/lib/iao/identity-trust
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  iao_state: {}
  iao_identity_trust: {}
