services:
  - type: web
    name: iao-backend
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OMEGA_DEV_TOKEN_KEY
        generateValue: true
      - key: AUDIT_HMAC_KEY
        generateValue: true
