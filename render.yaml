services:
  - type: web
    name: iao-federation-core
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEEPSEEK_API_KEY
        sync: false

  - type: cron
    name: iao-node-crawler
    env: python
    plan: free
    schedule: "0 * * * *" # Ejecutar cada hora
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/iao_autonomous_crawler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
