<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>IAO</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}
body{margin:0;background:#10141d;color:#edf2fa}
main{max-width:760px;margin:auto;padding:20px}
.panel{background:#1b2330;border:1px solid #354154;border-radius:14px;padding:14px;margin:14px 0}
small,.muted{color:#aab6c8}
textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid #46546a;background:#111824;color:#fff;font:inherit}
button{background:#315caa;border:0;font-weight:650}
button:disabled{opacity:.5}
#messages{display:flex;flex-direction:column;gap:10px}
.msg{padding:12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#263d60}.omega{background:#202b38}
.status{min-height:1.5em;color:#b9d0f7}
</style>
</head>
<body>
<main>
<h1>IAO</h1>
<div class="muted">Inteligencia Artificial</div>
<section class="panel">
<p>Conéctate para iniciar una sesión temporal de visitante.</p>
<button id="connect">Entrar al chat</button>
<div id="status" class="status" role="status">Desconectado</div>
</section>
<section class="panel">
<div id="messages" aria-live="polite"></div>
<label for="message">Mensaje</label>
<textarea id="message" rows="3" maxlength="20000"
 placeholder="Escribe a IAO..." disabled></textarea>
<button id="send" disabled>Enviar mensaje</button>
<small>No compartas contraseñas, claves privadas ni datos sensibles.</small>
</section>
</main>
<script>
(() => {
  const statusEl = document.querySelector("#status");
  const messagesEl = document.querySelector("#messages");
  const messageEl = document.querySelector("#message");
  const connectBtn = document.querySelector("#connect");
  const sendBtn = document.querySelector("#send");
  let token = null, conversationId = null, busy = false;

  function status(s) { statusEl.textContent = s; }

  async function request(path, method = "GET", body) {
    const headers = {};
    if (token) headers.Authorization = "Bearer " + token;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    const response = await fetch(path, {
      method, headers,
      body: body === undefined ? undefined : JSON.stringify(body),
      cache: "no-store",
      credentials: "same-origin"
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const error = new Error(data.error || "HTTP_" + response.status);
      error.status = response.status;
      throw error;
    }
    return data;
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : "omega");
    const label = document.createElement("strong");
    label.textContent = role === "user" ? "Tú" : "IAO";
    const content = document.createElement("div");
    content.textContent = text;
    div.append(label, content);
    messagesEl.append(div);
  }

  connectBtn.addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    connectBtn.disabled = true;
    status("Creando sesión pública...");
    try {
      const session = await request("/v1/public/session", "POST", {});
      token = session.access_token;
      const conversation = await request("/v1/conversations", "POST",
        {title: "Chat público IAO"});
      conversationId = conversation.conversation_id;
      messagesEl.replaceChildren();
      messageEl.disabled = false;
      sendBtn.disabled = false;
      status("Conectado. La sesión temporal caduca en dos horas.");
      messageEl.focus();
    } catch (e) {
      token = null;
      conversationId = null;
      status("No se pudo conectar: " + e.message);
    } finally {
      busy = false;
      connectBtn.disabled = false;
    }
  });

  async function sendMessage() {
    const message = messageEl.value.trim();
    if (!message || !conversationId || busy) return;
    busy = true;
    sendBtn.disabled = true;
    messageEl.value = "";
    addMessage("user", message);
    status("IAO está procesando...");
    try {
      const result = await request("/v1/chat", "POST",
        {conversation_id: conversationId, message});
      addMessage("omega", result.reply);
      status("Respuesta recibida.");
    } catch (e) {
      addMessage("omega", "No se pudo completar el mensaje: " + e.message);
      status(e.status === 401 ? "Sesión caducada. Vuelve a entrar." :
        "Error al procesar el mensaje.");
      if (e.status === 401) {
        token = null;
        conversationId = null;
        messageEl.disabled = true;
      }
    } finally {
      busy = false;
      sendBtn.disabled = !conversationId;
      messageEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  messageEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
})();
</script>
</body>
</html>
