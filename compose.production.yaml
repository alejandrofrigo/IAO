services:
  iao:
    build:
      context: .
      dockerfile: Dockerfile
    image: iao:production
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      # Keep the application private; terminate HTTPS at a host reverse proxy.
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      IAO_STATE_DIR: /var/lib/iao
      IAO_CORPUS_DIR: /app/knowledge
      OMEGA_TOKEN_SIGNING_KEY: ${OMEGA_TOKEN_SIGNING_KEY:?Set OMEGA_TOKEN_SIGNING_KEY}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Set AUDIT_HMAC_KEY}
      IAO_CORS_ORIGINS: ${IAO_CORS_ORIGINS:?Set IAO_CORS_ORIGINS to the public chat origin}
      IAO_AUTONOMY_WORKER_ENABLED: "true"
    volumes:
      - iao-state:/var/lib/iao
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  iao-state:
    # Docker-managed persistent volume; survives container replacement.
    # Back it up independently before host maintenance or migration.
