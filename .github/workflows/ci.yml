name: IAO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Validate browser JavaScript syntax
        run: |
          node --check web/device-authority.js
          node --check web/operator-identity.js

      - name: Lint production integration
        run: python -m ruff check apps/api/main.py omega/device_authority.py omega/service.py omega/store.py omega/task_worker.py tests/test_production_api.py tests/test_federation_status_truth.py tests/test_store_file_permissions.py tests/test_device_authority_permissions.py tests/test_device_authority.py tests/test_task_queue.py tests/test_service.py omega/server.py omega/federation_autojoin.py omega/federation_discovery.py omega/external_network.py tests/test_config.py tests/test_server_persistent_keys.py tests/test_api_runtime_lifespan.py tests/test_background_worker_lifecycle.py

      - name: Report repository-wide legacy lint debt
        continue-on-error: true
        run: python -m ruff check .

      - name: Compile Python
        run: python -m compileall -q omega apps tests tools

      - name: Run complete test suite
        run: python -m pytest -q
