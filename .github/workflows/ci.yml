name: IAO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Validate browser JavaScript syntax
        run: |
          node --check web/device-authority.js
          node --check web/operator-identity.js

      - name: Lint production integration
        run: python -m ruff check apps/api/main.py omega/device_authority.py omega/service.py omega/store.py omega/task_worker.py tests/test_production_api.py tests/test_federation_status_truth.py tests/test_store_file_permissions.py tests/test_device_authority_permissions.py tests/test_device_authority.py tests/test_task_queue.py tests/test_service.py omega/server.py omega/auth.py tests/test_auth_tokens.py tests/test_server_cors.py tests/test_federation_http_adapters.py tests/test_federation.py tests/test_runtime_privacy.py omega/federation_autojoin.py omega/federation_discovery.py omega/external_network.py tests/test_config.py tests/test_server_persistent_keys.py tests/test_api_runtime_lifespan.py tests/test_background_worker_lifecycle.py tests/test_api_readiness_diagnostics.py tests/test_server_http_contract.py omega/supervision.py tools/iao_autonomous_coordinator.py tools/iao_five_motor_supervisor.py tests/test_supervision_health.py tests/test_container_contract.py omega/federation_transport.py tests/test_federation_transport.py omega/federation_autojoin.py omega/federation_discovery.py tests/test_federation_autojoin_privacy.py omega/operational_log.py tests/test_operational_log_privacy.py omega/padge.py omega/deepseek_web.py tests/test_deepseek_web_privacy.py tests/test_api_route_method_matrix.py tests/test_api_error_contract.py tests/test_packaging_contract.py tests/test_task_worker_heartbeat.py

      - name: Report repository-wide legacy lint debt
        continue-on-error: true
        run: python -m ruff check .

      - name: Compile Python
        run: python -m compileall -q omega apps tests tools

      - name: Run complete test suite
        run: python -m pytest -q

  dependency-lock-resolution:
    name: Resolve and qualify complete dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve complete lockfile
        run: uv lock --no-progress

      - name: Verify locked development installation
        run: |
          uv sync --locked --extra dev
          uv run --locked python -m pip check

      - name: Publish resolved lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: iao-uv-lock
          path: uv.lock
          if-no-files-found: error
          retention-days: 3
