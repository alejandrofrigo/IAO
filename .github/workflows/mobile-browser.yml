name: IAO mobile browser integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-chromium:
    name: Mobile Chromium identity flow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install IAO and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run mobile browser integration
        run: python -m pytest -q tests/browser/test_operator_identity_mobile.py
