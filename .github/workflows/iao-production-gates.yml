name: IAO Production Gates

on:
  push:
    branches: ["main", "iao-*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gates:
    name: Deterministic security and readiness gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      OMEGA_DEV_TOKEN_KEY: ci-token-key-0123456789abcdef0123456789abcdef
      AUDIT_HMAC_KEY: ci-audit-key-0123456789abcdef0123456789abcdef
      MODEL_ADAPTER: disabled
      IAO_DEVICE_ENROLLMENT_ENABLED: "1"
      IAO_DEVICE_ENROLLMENT_CODE: ci-one-time-enrollment-code-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile production code
        run: python -m compileall -q omega apps
      - name: Validate browser identity scripts
        run: |
          node --check web/device-authority.js
          node --check web/operator-identity.js
      - name: Run deterministic API, identity and federation gates
        run: >-
          python -m pytest -q tests/test_production_api.py tests/test_federation_status_truth.py tests/test_federation.py tests/test_federation_autonomous.py tests/test_federation_transport.py tests/test_device_authority.py tests/test_task_queue.py tests/test_service.py tests/test_llm_router.py tests/test_federation_onion_discovery.py tests/test_federation_expansion_cycle.py tests/test_ipfs_gateway.py tests/test_ipfs_gateway.py
      - name: Lint production gate surface
        run: >-
          python -m ruff check apps/api/main.py omega/tools/ipfs_gateway.py omega/server.py omega/service.py omega/store.py omega/device_authority.py omega/task_worker.py tests/test_production_api.py tests/test_federation_status_truth.py tests/test_federation_autonomous.py tests/test_federation_transport.py tests/test_device_authority.py tests/test_task_queue.py tests/test_service.py tests/test_llm_router.py tests/test_federation_onion_discovery.py tests/test_federation_expansion_cycle.py