name: IAO isolated source validation

on:
  push:
    branches:
      - "iao-source-review-*"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" cryptography
      - name: Compile source
        run: python -m compileall -q omega tools tests
      - name: Prepare isolated test runtime
        run: |
          mkdir -p apps
          echo "AUDIT_HMAC_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -q
