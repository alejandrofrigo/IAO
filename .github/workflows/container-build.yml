name: IAO container build qualification

on:
  push:
    branches: [iao-production-build-20261126]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint production integration files
        run: python -m ruff check apps/api/main.py omega/device_authority.py omega/service.py tests/test_production_api.py tests/test_device_authority_permissions.py
      - name: Run production API contract tests
        run: python -m pytest -q tests/test_production_api.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build canonical API container (no publication)
        run: docker build --pull --tag iao-api:qualification .

      - name: Build deployment API container (no publication)
        run: docker build --pull --file deploy/Dockerfile --tag iao-api-deploy:qualification .

      - name: Verify container starts and serves liveness
        run: |
          TEST_TOKEN_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          TEST_AUDIT_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run --detach --rm --name iao-api-qualification \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges \
            --publish 127.0.0.1:18080:8080 iao-api:qualification
          trap 'docker stop iao-api-qualification >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health/live; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/health/live
          docker exec iao-api-qualification python -c "from pathlib import Path; p=Path('/app/knowledge'); files=sorted(p.glob('*.txt')); assert len(files) >= 1, 'production knowledge corpus missing'; assert (p/'omega-overview.txt').is_file(), 'required corpus document missing'; print('knowledge_corpus_files=' + str(len(files)))"
          docker exec --user iao iao-api-qualification python -c 'from omega.tools.knowledge_search import KnowledgeCorpus; from omega.tools.process_runner import run_tool_isolated; corpus=KnowledgeCorpus("/app/knowledge"); payload=corpus.validate_input({"query":"IAO","limit":1}); output, verdict=run_tool_isolated(corpus.run, corpus.verify, payload, 10); assert verdict == "PASS"; print("BWRAP_OS_SANDBOX=PASS")'
          docker run --detach --name iao-api-deploy-qualification \
            --read-only --tmpfs /tmp --tmpfs /var/lib/iao:rw,uid=10001,gid=10001 --cap-drop ALL \
            --security-opt no-new-privileges \
            --env OMEGA_DEV_TOKEN_KEY="$TEST_TOKEN_KEY" --env AUDIT_HMAC_KEY="$TEST_AUDIT_KEY" \
            --publish 127.0.0.1:18081:8080 iao-api-deploy:qualification
          trap 'docker stop iao-api-qualification iao-api-deploy-qualification >/dev/null 2>&1 || true; docker rm iao-api-deploy-qualification >/dev/null 2>&1 || true' EXIT
          deploy_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/health/live; then
              deploy_ready=1
              break
            fi
            sleep 2
          done
          if [ "$deploy_ready" -ne 1 ]; then
            echo "DEPLOY_IMAGE_LIVENESS=FAILED"
            docker logs iao-api-deploy-qualification
            exit 1
          fi
          docker exec --user 10001:10001 iao-api-deploy-qualification python -c 'from omega.tools.knowledge_search import KnowledgeCorpus; from omega.tools.process_runner import run_tool_isolated; corpus=KnowledgeCorpus("/app/knowledge"); payload=corpus.validate_input({"query":"IAO","limit":1}); output, verdict=run_tool_isolated(corpus.run, corpus.verify, payload, 10); assert verdict == "PASS"; print("DEPLOY_IMAGE_BWRAP_OS_SANDBOX=PASS")'
          docker logs iao-api-qualification
          docker logs iao-api-deploy-qualification
