name: IAO container build qualification

on:
  push:
    branches: [iao-production-build-20261126]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint production integration files
        run: python -m ruff check apps/api/main.py omega/device_authority.py omega/service.py tests/test_production_api.py tests/test_device_authority_permissions.py
      - name: Run production API contract tests
        run: python -m pytest -q tests/test_production_api.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose contract without real secrets
        env:
          OMEGA_TOKEN_SIGNING_KEY: qualification-only-token-signing-key-0123456789
          AUDIT_HMAC_KEY: qualification-only-audit-hmac-key-0123456789
          IAO_CORS_ORIGINS: https://example.invalid
        run: |
          docker compose -f compose.production.yaml config --quiet
          echo "production_compose_schema=PASS"

      - name: Build API container (no publication)
        run: docker build --pull --tag iao-api:qualification .

      - name: Verify runtime, corpus and resource-limited tool process boundary
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/iao-process-boundary-check.py <<'PY'
          from omega.tools.knowledge_search import KnowledgeCorpus
          from omega.tools.process_runner import run_tool_isolated

          def main():
              corpus = KnowledgeCorpus("/app/knowledge")
              payload = corpus.validate_input({"query": "IAO", "limit": 1})
              output, verdict = run_tool_isolated(corpus.run, corpus.verify, payload, 5)
              assert verdict == "PASS", verdict
              assert output.get("tool") == "knowledge.search"
              print("resource_limited_tool_process=PASS")

          if __name__ == "__main__":
              main()
          PY
          docker run --detach --rm --name iao-api-qualification \
            --publish 127.0.0.1:18080:8080 iao-api:qualification
          cleanup() {
            docker stop iao-api-qualification >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:18080/health/live
          docker exec iao-api-qualification python -c "from pathlib import Path; p=Path('/app/knowledge'); files=sorted(p.glob('*.txt')); assert len(files) >= 1, 'production knowledge corpus missing'; assert (p/'omega-overview.txt').is_file(), 'required corpus document missing'; print('knowledge_corpus_files=' + str(len(files)))"
          docker cp /tmp/iao-process-boundary-check.py iao-api-qualification:/tmp/iao-process-boundary-check.py
          docker exec iao-api-qualification python /tmp/iao-process-boundary-check.py
          docker logs iao-api-qualification
