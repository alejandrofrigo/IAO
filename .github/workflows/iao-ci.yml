name: IAO quality gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile project
        run: python -m compileall -q omega tools
      - name: Install declared runtime dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate browser security scripts
        run: |
          node --check web/api-config.js
          node --check web/device-authority.js
          node --check web/operator-identity.js
          node --check web/task-intake.js
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, re.S)
          if len(scripts) != 1:
              raise SystemExit("expected exactly one inline chat script")
          Path("/tmp/iao-index-inline.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/iao-index-inline.js
      - name: Test fail-closed API origin configuration
        run: node --test web/api-config.test.js
      - name: Run standard-library tests
        run: python -m unittest discover -v
