name: IAO node factory safety tests

on:
  pull_request:
    paths:
      - "omega/node_factory.py"
      - "omega/federation_identity.py"
      - "tools/iao_node_factory.py"
      - "tests/test_node_factory.py"
      - ".github/workflows/node-factory.yml"
  push:
    branches:
      - "codex/iao-node-factory-20261127"
    paths:
      - "omega/node_factory.py"
      - "omega/federation_identity.py"
      - "tools/iao_node_factory.py"
      - "tests/test_node_factory.py"
      - ".github/workflows/node-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  factory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install "cryptography==44.0.0" "pytest==8.3.4"
      - name: Compile factory and identity modules
        run: python -m compileall -q omega/node_factory.py omega/federation_identity.py tools/iao_node_factory.py
      - name: Run factory safety tests
        run: python -m pytest -q tests/test_node_factory.py
