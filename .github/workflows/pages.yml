name: Publish IAO Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare provider-neutral static site
        env:
          IAO_API_BASE_URL: ${{ vars.IAO_API_BASE_URL }}
        run: |
          set -eu
          test -f web/index.html
          mkdir -p _site
          cp -a web/. _site/
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          value = os.environ.get("IAO_API_BASE_URL", "").strip()
          if value:
              parsed = urlsplit(value)
              if (parsed.scheme != "https" or not parsed.hostname
                      or parsed.username or parsed.password
                      or parsed.port not in (None, 443)
                      or parsed.path not in ("", "/")
                      or parsed.query or parsed.fragment):
                  raise SystemExit("IAO_API_BASE_URL must be an HTTPS origin without credentials, path, query, or fragment")
          output = """/* Generated by the GitHub Pages build. */
          window.IAO_API_BASE = %s;
          window.iaoApiUrl = function (path) {
            const base = String(window.IAO_API_BASE || "").trim();
            if (!base) throw new Error("IAO_API_ENDPOINT_NOT_CONFIGURED");
            const origin = new URL(base);
            if (origin.protocol !== "https:" || !origin.hostname ||
                origin.username || origin.password || origin.pathname !== "/" ||
                origin.search || origin.hash) {
              throw new Error("IAO_API_ENDPOINT_INVALID");
            }
            return new URL(String(path || "").replace(/^\\/+/, ""),
              origin.origin + "/").toString();
          };
          """ % json.dumps(value)
          Path("_site/api-config.js").write_text(output, encoding="utf-8")
          print("api_endpoint_configured=" + ("yes" if value else "no (safe offline frontend)"))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
