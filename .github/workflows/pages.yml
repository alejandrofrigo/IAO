name: Publish IAO Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          test -f web/index.html
          mkdir -p _site
          cp -a web/. _site/
      - name: Inject validated HTTPS API origin when configured
        env:
          IAO_API_BASE: ${{ vars.IAO_API_BASE }}
        run: |
          python - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          base = os.environ.get("IAO_API_BASE", "").strip()
          if not base:
              print("IAO_API_BASE absent: published chat will remain fail-closed")
          else:
              try:
                  parsed = urlsplit(base)
                  port = parsed.port
              except ValueError:
                  raise SystemExit("IAO_API_BASE_INVALID")
              if (
                  parsed.scheme != "https" or not parsed.hostname
                  or parsed.username or parsed.password
                  or parsed.hostname in {"localhost", "127.0.0.1", "::1"}
                  or (port is not None and port != 443)
                  or parsed.path not in {"", "/"}
                  or parsed.query or parsed.fragment
              ):
                  raise SystemExit("IAO_API_BASE_INVALID")
              index = Path("_site/index.html")
              source = index.read_text(encoding="utf-8")
              if 'name="iao-api-base"' in source:
                  raise SystemExit("IAO_API_BASE_META_ALREADY_PRESENT")
              meta = '<meta name="iao-api-base" content="' + html.escape(base, quote=True) + '">'
              if "<head>" not in source:
                  raise SystemExit("HTML_HEAD_MISSING")
              index.write_text(source.replace("<head>", "<head>\n    " + meta, 1), encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
